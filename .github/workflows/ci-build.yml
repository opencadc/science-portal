# Builds the Docker image on every push to `main` (and manual runs) without publishing.
# When a GitHub Release is published, logs into Harbor and pushes the image using the tags
# from that release plus `latest`.
#
# Configure in the repo:
# - Variables (Settings → Secrets and variables → Actions → Variables):
#   - HARBOR_REGISTRY — hostname only, e.g. `harbor.example.org`
#   - HARBOR_REPOSITORY — image path inside the registry, e.g. `myproject/science-portal`
# - Secrets:
#   - HARBOR_USERNAME
#   - HARBOR_PASSWORD — password or Harbor robot-account token

name: Build Docker image for the Science Portal Next.js

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags and push mode
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            REG='${{ vars.HARBOR_REGISTRY }}'
            REPO='${{ vars.HARBOR_REPOSITORY }}'
            REL='${{ github.event.release.tag_name }}'
            {
              echo "push=true"
              echo 'tags<<__TAGS__'
              echo "${REG}/${REPO}:${REL}"
              echo "${REG}/${REPO}:latest"
              echo __TAGS__
            } >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Log in to Harbor
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Explicit build-args: next.config basePath is fixed at image build time.
          # If Dockerfile defaults change, update this workflow to match CI expectations.
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/science-portal
