# CI on every branch push: lint, test, Docker build, and Helm lint — no Harbor publish.
# Manual runs (`workflow_dispatch`) run the same checks.
#
# Publishing happens only via GitHub Releases in `harbor-release.yml`:
#   - Prerelease: build and push the image (release tag + :sha-<git-sha>), sign, package Helm.
#   - Final release: promote :sha-<git-sha> to the release tag (no rebuild), sign, package Helm.

name: Science Portal CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/science-portal

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.2

      - name: Helm lint
        run: helm lint ./helm
