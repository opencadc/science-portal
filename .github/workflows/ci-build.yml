# Builds the Docker image on every push to `main` and pushes a commit-scoped tag
# (`:sha-<git-sha>`) to Harbor. Manual runs (`workflow_dispatch`) build only — no push.
#
# Prerelease and final GitHub Releases do not rebuild here; see `harbor-release.yml`,
# which promotes `:sha-<git-sha>` to the release tag, signs the image, packages Helm,
# and uploads to Harbor.
#
# Configure in the repo:
# - Variables:
#   - HARBOR_REGISTRY — registry hostname used for Docker pushes.
#   - HARBOR_REPOSITORY — Docker image path, e.g. `myproject/science-portal`.
# - Secrets:
#   - HARBOR_USERNAME, HARBOR_PASSWORD — must allow registry push.

name: Science Portal CI (build only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags and push mode
        id: meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REG='${{ vars.HARBOR_REGISTRY }}'
          REPO='${{ vars.HARBOR_REPOSITORY }}'

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            {
              echo "push=true"
              echo 'tags<<__TAGS__'
              echo "${REG}/${REPO}:sha-${GITHUB_SHA}"
              echo __TAGS__
            } >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Harbor (Docker)
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/science-portal
