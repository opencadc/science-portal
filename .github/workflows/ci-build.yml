# Builds the Docker image on every push to `main` (and manual runs) without publishing.
# When a GitHub Release is published: push the image to Harbor Repository (`:tag` + `:latest`),
# Cosign-sign the image digest (Fulcio/GitHub Actions keyless OIDC); patch Helm chart defaults;
# upload the packaged `.tgz` via Harbor ChartMuseum-compatible HTTP API so charts appear under
# the project **Helm Charts** tab (not OCI/`oci://`).
#
# Configure in the repo:
# - Variables:
#   - HARBOR_REGISTRY — registry hostname used for Docker (and default API base HTTPS host).
#   - HARBOR_REPOSITORY — Docker image path, e.g. `myproject/science-portal`.
#   - HARBOR_HELM_PROJECT (optional) — Harbor **project name** for classic Helm Charts upload.
#   - HARBOR_HELM_OCI_REPOSITORY (deprecated alias) — if set and HARBOR_HELM_PROJECT is empty,
#       used as the same Harbor project override (backwards compatibility).
#   - HARBOR_API_BASE (optional) — full base URL for Harbor if not `https://<HARBOR_REGISTRY>`
#       (e.g. `https://harbor.example.com` or `https://example.com/harbor` with no trailing slash).
#   - COSIGN_REGISTRY_REFERRERS_MODE (optional) — `legacy` (default when unset) or `oci-1-1`.
#       Older Harbor / distributions may not implement GET /v2/.../referrers — use legacy.
# - Secrets:
#   - HARBOR_USERNAME, HARBOR_PASSWORD — must allow registry push + Chart upload permissions.
#
# Org note: id-token permission is for Fulcio/GitHub Actions keyless image signing only.

name: Science Portal CI and Harbor releases

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags and push mode
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            REG='${{ vars.HARBOR_REGISTRY }}'
            REPO='${{ vars.HARBOR_REPOSITORY }}'
            REL='${{ github.event.release.tag_name }}'
            {
              echo "push=true"
              echo 'tags<<__TAGS__'
              echo "${REG}/${REPO}:${REL}"
              echo "${REG}/${REPO}:latest"
              echo __TAGS__
            } >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Resolve Harbor Helm chart project (classic Chart repo)
        id: harbor_helm
        if: github.event_name == 'release'
        env:
          HARBOR_REPOSITORY: ${{ vars.HARBOR_REPOSITORY }}
          HELM_PROJECT_PRIMARY: ${{ vars.HARBOR_HELM_PROJECT }}
          HELM_LEGACY: ${{ vars.HARBOR_HELM_OCI_REPOSITORY }}
        run: |
          if [ -n "${HELM_PROJECT_PRIMARY:-}" ]; then
            echo "helm_project=${HELM_PROJECT_PRIMARY}" >> "${GITHUB_OUTPUT}"
          elif [ -n "${HELM_LEGACY:-}" ]; then
            echo "helm_project=${HELM_LEGACY}" >> "${GITHUB_OUTPUT}"
          else
            case "${HARBOR_REPOSITORY}" in
              */*) echo "helm_project=${HARBOR_REPOSITORY%%/*}" >> "${GITHUB_OUTPUT}" ;;
              *)
                echo "::error::HARBOR_REPOSITORY must be project/name (contain '/') or set HARBOR_HELM_PROJECT."
                exit 1
                ;;
            esac
          fi

      - name: Log in to Harbor (Docker)
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Install Cosign (release / keyless)
        if: github.event_name == 'release'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Build Docker image
        id: build_push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_BASE_PATH=/science-portal

      - name: Cosign sign container image (digest, keyless)
        if: github.event_name == 'release'
        env:
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_REPOSITORY: ${{ vars.HARBOR_REPOSITORY }}
          COSIGN_REGISTRY_REFERRERS_MODE: ${{ vars.COSIGN_REGISTRY_REFERRERS_MODE }}
          REGISTRY_USER: ${{ secrets.HARBOR_USERNAME }}
          REGISTRY_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          DIG="${{ steps.build_push.outputs.digest }}"
          if [ -z "${DIG}" ]; then
            echo "::error::Docker build-push did not produce a digest output (cannot Cosign)."
            exit 1
          fi
          REFERRERS="${COSIGN_REGISTRY_REFERRERS_MODE:-legacy}"
          IMG="${HARBOR_REGISTRY}/${HARBOR_REPOSITORY}"
          printf 'Cosign-signing container: %s@%s (registry-referrers-mode=%s)\n' "${IMG}" "${DIG}" "${REFERRERS}"
          cosign sign --yes \
            --registry-referrers-mode="${REFERRERS}" \
            --registry-username "${REGISTRY_USER}" \
            --registry-password "${REGISTRY_PASS}" \
            "${IMG}@${DIG}"

      - name: Install Helm (release)
        if: github.event_name == 'release'
        uses: azure/setup-helm@v4
        with:
          version: v3.20.2

      - name: Bump Helm Chart.yaml + defaults for this release
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_REPOSITORY: ${{ vars.HARBOR_REPOSITORY }}
        run: python3 .github/scripts/patch-helm-release.py

      - name: Helm lint (release)
        if: github.event_name == 'release'
        run: helm lint ./helm

      - name: Package Helm chart (release)
        if: github.event_name == 'release'
        id: helm_pack
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package ./helm --destination dist
          shopt -s nullglob
          pkgs=(dist/science-portal-*.tgz)
          if [ "${#pkgs[@]}" -ne 1 ]; then
            printf 'Expected exactly one packaged chart under dist/, found: [%s]\n' "${pkgs[*]-}"
            exit 1
          fi
          echo "package=${pkgs[0]}" >> "${GITHUB_OUTPUT}"

      - name: Upload Helm chart to Harbor (Helm Charts tab / ChartMuseum API)
        if: github.event_name == 'release'
        env:
          PACKAGE: ${{ steps.helm_pack.outputs.package }}
          HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          HARBOR_API_BASE_IN: ${{ vars.HARBOR_API_BASE }}
          CHART_PROJECT: ${{ steps.harbor_helm.outputs.helm_project }}
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGE}" ] || [ ! -f "${PACKAGE}" ]; then
            echo "::error::Missing packaged chart (expected PACKAGE path from previous step)."
            exit 1
          fi
          if [ -z "${CHART_PROJECT}" ]; then
            echo "::error::Could not resolve Harbor project for Helm chart upload."
            exit 1
          fi

          BASE="${HARBOR_API_BASE_IN:-}"
          BASE="${BASE%/}"
          if [ -z "${BASE}" ]; then
            BASE="https://${HARBOR_REGISTRY}"
          fi

          URL="${BASE}/api/chartrepo/${CHART_PROJECT}/charts"
          printf 'POST chart → %s (project=%s)\n' "${URL}" "${CHART_PROJECT}"

          prov_args=()
          if [ -f "${PACKAGE}.prov" ]; then
            printf 'Including provenance %s.prov\n' "${PACKAGE}"
            prov_args+=( -F "prov=@${PACKAGE}.prov" )
          fi

          curl --fail-with-body -sS \
            --user "${HARBOR_USER}:${HARBOR_PASS}" \
            -X POST "${URL}" \
            -F "chart=@${PACKAGE};type=application/x-compressed-tar" \
            "${prov_args[@]}"
